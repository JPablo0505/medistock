server:
  port: 8080

spring:
  application:
    name: medistock

  datasource:
    url: jdbc:postgresql://localhost:5432/medistock
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    schemas:
      - product_catalog
      - inventory
      - sales
      - alerting
    default-schema: product_catalog
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

logging:
  level:
    com.medistock: DEBUG
    org.springframework: INFO
    org.hibernate: WARN
